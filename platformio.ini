; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@7.0.1
extra_scripts = pre:build_secrets.py
; ESP32 revision 1 chips (this Model B is v1.1) corrupt PSRAM data under some
; load/store sequences. The SDK libraries are built with this workaround; the
; application must be too, because the reading buffers live in PSRAM.
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
build_src_filter =
    +<*.ino>
    +<*.cpp>
    -<collector/>
    -<lib/>
board = esp-wrover-kit
board_build.f_cpu = 160000000L
framework = arduino
monitor_speed = 460800
upload_speed = 460800
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv

; Private USB bootstrap image for installing OTA-capable production firmware.
; This embeds the configured telemetry credential and must never be published.
[env:esp32dev-ota-production]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_OTA=1

; Compile-only validation target for unattended OTA. The regular production
; environment leaves ENABLE_OTA disabled until hardware checks are complete.
[env:esp32dev-ota-test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_OTA=1

